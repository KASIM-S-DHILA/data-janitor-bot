services:
  - type: web
    name: data-janitor-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: LOG_URL
        value: https://data-janitor-bot.onrender.com/run.jsonl
